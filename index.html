<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TweekCal">
  <title>TweekCal Pro</title>

  <!-- Иконка для домашнего экрана iOS -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%231c1c1e'/><rect x='28' y='36' width='124' height='22' rx='6' fill='%23ff3b30'/><circle cx='46' cy='88' r='8' fill='%2334c759'/><rect x='66' y='82' width='80' height='12' rx='6' fill='%23ffffff'/><circle cx='46' cy='126' r='8' fill='%23007aff'/><rect x='66' y='120' width='56' height='12' rx='6' fill='%238e8e93'/></svg>">

  <!-- Встроенный Web Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"TweekCal Pro","short_name":"TweekCal","start_url":".","display":"standalone","background_color":"#fdfdfd","theme_color":"#1c1c1e"}'>

  <style>
    :root {
      --bg: #fdfdfd;
      --surface: #ffffff;
      --surface-2: #f2f2f7;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --line: #1c1c1e;
      --accent: #1c1c1e;
      --accent-text: #ffffff;
      --today: #ff3b30;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --border: #38383a;
      --line: #f2f2f7;
      --accent: #ffffff;
      --accent-text: #000000;
      --today: #ff453a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      user-select: none;
      overscroll-behavior-y: none;
    }

    /* Верхняя панель */
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-month {
      font-size: 17px;
      font-weight: 700;
      min-width: 120px;
      text-align: center;
    }

    button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    button.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #8e8e93;
      display: inline-block;
      margin-right: 4px;
    }
    .sync-dot.synced { background: #34c759; }
    .sync-dot.pending { background: #ff9500; }
    .sync-dot.error { background: #ff3b30; }

    .search-bar {
      width: 100%;
      background: var(--surface-2);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      margin-top: 6px;
      display: none;
    }
    .search-bar.open { display: block; }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 10px 16px 100px 16px;
    }

    /* Вид Недели (Tweek) */
    .day-block {
      padding: 14px 0 8px 0;
      border-bottom: 2px solid var(--line);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .day-name {
      font-size: 16px;
      font-weight: 700;
    }
    .day-name.is-today { color: var(--today); }
    .day-date { font-size: 13px; color: var(--muted); }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      border-radius: 6px;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .checkbox {
      width: 21px;
      height: 21px;
      border: 1.8px solid var(--muted);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      cursor: pointer;
    }

    .task-item.done .checkbox {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .color-pill-indicator {
      width: 4px;
      height: 18px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .task-body {
      flex-grow: 1;
      overflow: hidden;
      cursor: pointer;
    }

    .task-text {
      display: block;
      word-break: break-word;
    }

    .task-meta {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-mini {
      padding: 4px 7px;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface-2);
      border: none;
    }

    .add-input {
      width: 100%;
      border: none;
      padding: 9px 0 4px 0;
      font-size: 15px;
      background: transparent;
      outline: none;
      color: var(--text);
    }
    .add-input::placeholder { color: var(--muted); opacity: 0.6; }

    /* Сетка Месяца */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .weekday-label {
      background: var(--surface-2);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 0;
      color: var(--muted);
    }

    .month-cell {
      background: var(--surface);
      min-height: 74px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
    }
    .month-cell.other-month { opacity: 0.35; }
    .month-cell.selected { outline: 2px solid var(--today); z-index: 2; }

    .cell-number {
      font-size: 12px;
      font-weight: 600;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .cell-number.is-today { background: var(--today); color: #fff; }

    .cell-pill {
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--surface-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 3px solid transparent;
    }
    .cell-pill.done { opacity: 0.4; text-decoration: line-through; }

    /* Почасовой таймлайн (Вид Дня) */
    .timeline-row {
      display: flex;
      border-bottom: 1px solid var(--border);
      min-height: 48px;
    }
    .timeline-hour {
      width: 52px;
      font-size: 12px;
      color: var(--muted);
      padding-top: 6px;
      flex-shrink: 0;
    }
    .timeline-slot {
      flex-grow: 1;
      padding: 4px 0;
    }

    /* Блок Someday */
    .someday-box {
      margin-top: 24px;
      background: var(--surface-2);
      padding: 14px;
      border-radius: 12px;
    }

    /* Модальные окна / Bottom Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }
    .modal-backdrop.open { display: flex; }

    .sheet {
      background: var(--surface);
      width: 100%;
      max-width: 600px;
      border-radius: 18px 18px 0 0;
      padding: 18px 16px calc(20px + env(safe-area-inset-bottom)) 16px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .form-row {
      margin-bottom: 12px;
    }
    .form-label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    .form-input, .form-textarea {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }
    .form-row-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-picker {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .color-Swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-Swatch.selected {
      border-color: var(--text);
      transform: scale(1.12);
    }

    .subtask-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="nav-group">
      <button onclick="shiftPeriod(-1)">←</button>
      <div class="title-month" id="headerTitle">Октябрь</div>
      <button onclick="shiftPeriod(1)">→</button>
      <button onclick="goToday()" style="font-size:12px">Сегодня</button>
    </div>
    <div class="nav-group">
      <button onclick="toggleSearch()" title="Поиск">🔍</button>
      <button onclick="toggleTheme()" title="Тема">◐</button>
      <button onclick="openSyncModal()" title="Синхронизация и бэкап">
        <span class="sync-dot" id="syncDot"></span>☁️
      </button>
    </div>
  </div>
  <div class="nav-group" style="justify-content: space-between;">
    <div class="nav-group" style="width:100%">
      <button id="btnWeek" class="active" style="flex:1" onclick="setView('week')">Неделя</button>
      <button id="btnMonth" style="flex:1" onclick="setView('month')">Месяц</button>
      <button id="btnDay" style="flex:1" onclick="setView('day')">День (Часы)</button>
    </div>
  </div>
  <input type="text" id="searchInput" class="search-bar" placeholder="Поиск по задачам и заметкам..." oninput="render()">
</header>

<div class="container">
  <div id="mainView"></div>

  <!-- Секция Someday -->
  <div class="someday-box" id="somedayContainer">
    <div class="day-header">
      <span class="day-name">Когда-нибудь (Someday)</span>
      <span class="day-date">Без даты</span>
    </div>
    <ul class="task-list" id="somedayList"></ul>
    <input type="text" class="add-input" placeholder="+ Добавить задачу без даты..." 
           onkeydown="if(event.key==='Enter') addTask(null, null, this)">
  </div>
</div>

<!-- ШТОРКА РЕДАКТИРОВАНИЯ ЗАДАЧИ -->
<div class="modal-backdrop" id="taskModal" onclick="if(event.target===this) closeTaskModal()">
  <div class="sheet">
    <div class="sheet-header">
      <strong>Детали задачи</strong>
      <button onclick="closeTaskModal()">Готово</button>
    </div>
    <div class="form-row">
      <input type="text" id="editTitle" class="form-input" placeholder="Название задачи" style="font-weight:600">
    </div>
    <div class="form-row form-row-inline">
      <div>
        <label class="form-label">Дата (пусто = Someday)</label>
        <input type="date" id="editDate" class="form-input">
      </div>
      <div>
        <label class="form-label">Время (опционально)</label>
        <input type="time" id="editTime" class="form-input">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">Цвет маркера</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="form-row">
      <label class="form-label">Подзадачи (чеклист)</label>
      <div id="subtasksList"></div>
      <input type="text" id="newSubtaskInput" class="add-input" placeholder="+ Добавить подзадачу и нажать Enter..."
             onkeydown="if(event.key==='Enter') addSubtaskFromInput()">
    </div>
    <div class="form-row">
      <label class="form-label">Заметка</label>
      <textarea id="editNotes" class="form-textarea" rows="3" placeholder="Ссылки, детали, мысли..."></textarea>
    </div>
    <div class="form-row" style="display:flex; justify-content:space-between; align-items:center;">
      <label style="font-size:14px">
        <input type="checkbox" id="editRollover"> Автоперенос на сегодня, если просрочено
      </label>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:16px;">
      <button onclick="setEditDateToSomeday()">Убрать в Someday</button>
      <button onclick="deleteActiveTask()" style="color:#ff3b30; border-color:#ff3b30">Удалить задачу</button>
    </div>
  </div>
</div>

<!-- ШТОРКА СИНХРОНИЗАЦИИ И БЭКАПА -->
<div class="modal-backdrop" id="syncModal" onclick="if(event.target===this) closeSyncModal()">
  <div class="sheet">
    <div class="sheet-header">
      <strong>Облако и Резервная копия</strong>
      <button onclick="closeSyncModal()">Закрыть</button>
    </div>
    <p style="font-size:13px; color:var(--muted); margin-top:0;">
      Для бесплатной синхронизации между iPhone и ПК укажите URL и Anon Key вашего проекта Supabase (таблица <code>tasks</code>).
    </p>
    <div class="form-row">
      <label class="form-label">Supabase Project URL</label>
      <input type="url" id="sbUrl" class="form-input" placeholder="https://xxxx.supabase.co">
    </div>
    <div class="form-row">
      <label class="form-label">Supabase Anon Key</label>
      <input type="password" id="sbKey" class="form-input" placeholder="eyJhbGciOiJIUzI1NiIsInR5...">
    </div>
    <div style="display:flex; gap:8px; margin-bottom:18px;">
      <button class="active" onclick="saveSyncConfig()">Сохранить и синхронизировать</button>
      <button onclick="syncNow()">Обновить сейчас</button>
    </div>
    <hr style="border:none; border-top:1px solid var(--border); margin:14px 0;">
    <div class="form-row">
      <label class="form-label">Локальный бэкап (JSON файл)</label>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button onclick="exportJSON()">Скачать бэкап (.json)</button>
        <button onclick="document.getElementById('importFile').click()">Загрузить из файла</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
      </div>
    </div>
  </div>
</div>

<script>
  // --- РЕГИСТРАЦИЯ SERVICE WORKER ДЛЯ АВИАРЕЖИМА ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // --- КОНСТАНТЫ И СОСТОЯНИЕ ---
  const STORAGE_KEY = 'tweek_cal_tasks_v1';
  const CONFIG_KEY = 'tweek_cal_config_v1';
  const COLORS = ['transparent', '#ff3b30', '#ff9500', '#34c759', '#007aff', '#af52de'];

  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let config = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{"theme":"light","sbUrl":"","sbKey":"","lastSync":0}');
  let currentView = 'week'; // 'week' | 'month' | 'day'
  let anchorDate = new Date();
  let selectedDateStr = toISODate(new Date());
  let editingTaskId = null;
  let editingColor = 'transparent';

  const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const DAYS_RU = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const SHORT_DAYS_RU = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  document.documentElement.setAttribute('data-theme', config.theme || 'light');

  function toISODate(d) {
    const z = n => ('0' + n).slice(-2);
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  }

  function saveConfig() {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  }

  function saveTasks(triggerSync = true) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    render();
    if (triggerSync) syncNow();
  }

  // Автоперенос просроченных задач (Rollover)
  function autoRolloverPastTasks() {
    const todayStr = toISODate(new Date());
    let changed = false;
    tasks.forEach(t => {
      if (!t.deleted && t.date && t.date < todayStr && !t.completed && t.rollover !== false) {
        t.date = todayStr;
        t.updatedAt = Date.now();
        t.syncStatus = 'pending';
        changed = true;
      }
    });
    if (changed) saveTasks();
  }

  // --- CRUD ЗАДАЧ ---
  function addTask(dateStr, timeStr, inputEl) {
    const title = inputEl.value.trim();
    if (!title) return;
    tasks.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
      title,
      date: dateStr,
      time: timeStr || '',
      notes: '',
      color: 'transparent',
      subtasks: [],
      completed: false,
      rollover: true,
      deleted: false,
      updatedAt: Date.now(),
      syncStatus: 'pending'
    });
    inputEl.value = '';
    saveTasks();
  }

  function toggleTask(id) {
    const t = tasks.find(x => x.id === id);
    if (t) {
      t.completed = !t.completed;
      t.updatedAt = Date.now();
      t.syncStatus = 'pending';
      saveTasks();
    }
  }

  function moveTaskTomorrow(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (!t.date) {
      t.date = toISODate(new Date());
    } else {
      const [y, m, d] = t.date.split('-').map(Number);
      t.date = toISODate(new Date(y, m - 1, d + 1));
    }
    t.updatedAt = Date.now();
    t.syncStatus = 'pending';
    saveTasks();
  }

  // --- МОДАЛКА ДЕТАЛЕЙ ЗАДАЧИ ---
  function openTaskModal(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    editingTaskId = id;
    editingColor = t.color || 'transparent';
    document.getElementById('editTitle').value = t.title;
    document.getElementById('editDate').value = t.date || '';
    document.getElementById('editTime').value = t.time || '';
    document.getElementById('editNotes').value = t.notes || '';
    document.getElementById('editRollover').checked = t.rollover !== false;
    renderColorPicker();
    renderSubtasks(t);
    document.getElementById('taskModal').classList.add('open');
  }

  function renderColorPicker() {
    const box = document.getElementById('colorPicker');
    box.innerHTML = COLORS.map(c => `
      <div class="color-Swatch ${editingColor === c ? 'selected' : ''}" 
           style="background:${c === 'transparent' ? 'var(--surface-2)' : c}"
           onclick="selectEditColor('${c}')"></div>
    `).join('');
  }

  function selectEditColor(c) {
    editingColor = c;
    renderColorPicker();
  }

  function renderSubtasks(t) {
    const list = t.subtasks || [];
    const container = document.getElementById('subtasksList');
    container.innerHTML = list.map((s, idx) => `
      <div class="subtask-row">
        <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask(${idx})">
        <span style="flex:1; font-size:14px; ${s.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${escapeHTML(s.text)}</span>
        <button class="btn-mini" onclick="removeSubtask(${idx})">✕</button>
      </div>
    `).join('');
  }

  function addSubtaskFromInput() {
    const input = document.getElementById('newSubtaskInput');
    const text = input.value.trim();
    if (!text || !editingTaskId) return;
    const t = tasks.find(x => x.id === editingTaskId);
    if (!t.subtasks) t.subtasks = [];
    t.subtasks.push({ text, done: false });
    input.value = '';
    renderSubtasks(t);
  }

  function toggleSubtask(idx) {
    const t = tasks.find(x => x.id === editingTaskId);
    if (t && t.subtasks && t.subtasks[idx]) {
      t.subtasks[idx].done = !t.subtasks[idx].done;
      renderSubtasks(t);
    }
  }

  function removeSubtask(idx) {
    const t = tasks.find(x => x.id === editingTaskId);
    if (t && t.subtasks) {
      t.subtasks.splice(idx, 1);
      renderSubtasks(t);
    }
  }

  function setEditDateToSomeday() {
    document.getElementById('editDate').value = '';
    document.getElementById('editTime').value = '';
  }

  function closeTaskModal() {
    if (editingTaskId) {
      const t = tasks.find(x => x.id === editingTaskId);
      if (t) {
        const newTitle = document.getElementById('editTitle').value.trim();
        if (newTitle) t.title = newTitle;
        t.date = document.getElementById('editDate').value || null;
        t.time = document.getElementById('editTime').value || '';
        t.notes = document.getElementById('editNotes').value;
        t.color = editingColor;
        t.rollover = document.getElementById('editRollover').checked;
        t.updatedAt = Date.now();
        t.syncStatus = 'pending';
        saveTasks();
      }
    }
    editingTaskId = null;
    document.getElementById('taskModal').classList.remove('open');
  }

  function deleteActiveTask() {
    if (!editingTaskId) return;
    const t = tasks.find(x => x.id === editingTaskId);
    if (t) {
      t.deleted = true;
      t.updatedAt = Date.now();
      t.syncStatus = 'pending';
      saveTasks();
    }
    editingTaskId = null;
    document.getElementById('taskModal').classList.remove('open');
  }

  // --- НАВИГАЦИЯ И ТЕМА ---
  function setView(v) {
    currentView = v;
    document.getElementById('btnWeek').classList.toggle('active', v === 'week');
    document.getElementById('btnMonth').classList.toggle('active', v === 'month');
    document.getElementById('btnDay').classList.toggle('active', v === 'day');
    render();
  }

  function shiftPeriod(dir) {
    if (currentView === 'week') anchorDate.setDate(anchorDate.getDate() + dir * 7);
    else if (currentView === 'month') anchorDate.setMonth(anchorDate.getMonth() + dir);
    else {
      anchorDate.setDate(anchorDate.getDate() + dir);
      selectedDateStr = toISODate(anchorDate);
    }
    render();
  }

  function goToday() {
    anchorDate = new Date();
    selectedDateStr = toISODate(anchorDate);
    render();
  }

  function toggleTheme() {
    config.theme = config.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', config.theme);
    saveConfig();
  }

  function toggleSearch() {
    const sb = document.getElementById('searchInput');
    sb.classList.toggle('open');
    if (sb.classList.contains('open')) sb.focus();
    else { sb.value = ''; render(); }
  }

  // --- ОТРИСОВКА ---
  function getActiveTasks() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    return tasks.filter(t => {
      if (t.deleted) return false;
      if (!q) return true;
      return t.title.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q);
    }).sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  }

  function renderTaskItem(t) {
    const subCount = (t.subtasks || []).length;
    const subDone = (t.subtasks || []).filter(s => s.done).length;
    return `
      <li class="task-item ${t.completed ? 'done' : ''}">
        <div class="checkbox" onclick="toggleTask('${t.id}')">${t.completed ? '✓' : ''}</div>
        ${t.color && t.color !== 'transparent' ? `<div class="color-pill-indicator" style="background:${t.color}"></div>` : ''}
        <div class="task-body" onclick="openTaskModal('${t.id}')">
          <span class="task-text">${escapeHTML(t.title)}</span>
          <div class="task-meta">
            ${t.time ? `<span>⏰ ${t.time}</span>` : ''}
            ${subCount ? `<span>☑ ${subDone}/${subCount}</span>` : ''}
            ${t.notes ? `<span>📝</span>` : ''}
          </div>
        </div>
        <button class="btn-mini" title="На +1 день" onclick="moveTaskTomorrow('${t.id}')">→</button>
      </li>
    `;
  }

  function render() {
    const todayStr = toISODate(new Date());
    const visibleTasks = getActiveTasks();
    document.getElementById('headerTitle').textContent = 
      `${MONTHS_RU[anchorDate.getMonth()]} ${anchorDate.getFullYear()}`;

    const main = document.getElementById('mainView');

    if (currentView === 'week') {
      const d = new Date(anchorDate);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));

      let html = '';
      for (let i = 0; i < 7; i++) {
        const cur = new Date(monday);
        cur.setDate(monday.getDate() + i);
        const dateStr = toISODate(cur);
        const dayTasks = visibleTasks.filter(t => t.date === dateStr);
        const isToday = dateStr === todayStr;

        html += `
          <div class="day-block">
            <div class="day-header">
              <span class="day-name ${isToday ? 'is-today' : ''}" onclick="openDayTimeline('${dateStr}')" style="cursor:pointer">
                ${DAYS_RU[cur.getDay()]}
              </span>
              <span class="day-date">${cur.getDate()}.${('0'+(cur.getMonth()+1)).slice(-2)}</span>
            </div>
            <ul class="task-list">${dayTasks.map(renderTaskItem).join('')}</ul>
            <input type="text" class="add-input" placeholder="+ Добавить задачу..." 
                   onkeydown="if(event.key==='Enter') addTask('${dateStr}', null, this)">
          </div>
        `;
      }
      main.innerHTML = html;

    } else if (currentView === 'month') {
      const year = anchorDate.getFullYear();
      const month = anchorDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const startOffset = (firstDay.getDay() + 6) % 7;
      const startDate = new Date(year, month, 1 - startOffset);

      let gridHtml = `<div class="month-grid">`;
      SHORT_DAYS_RU.forEach(label => gridHtml += `<div class="weekday-label">${label}</div>`);

      for (let i = 0; i < 42; i++) {
        const cur = new Date(startDate);
        cur.setDate(startDate.getDate() + i);
        const dateStr = toISODate(cur);
        const inMonth = cur.getMonth() === month;
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDateStr;
        const dayTasks = visibleTasks.filter(t => t.date === dateStr);

        gridHtml += `
          <div class="month-cell ${inMonth ? '' : 'other-month'} ${isSelected ? 'selected' : ''}" 
               onclick="selectMonthDay('${dateStr}')">
            <div class="cell-number ${isToday ? 'is-today' : ''}">${cur.getDate()}</div>
            ${dayTasks.slice(0, 3).map(t => `
              <div class="cell-pill ${t.completed ? 'done' : ''}" style="border-left-color:${t.color || 'transparent'}">
                ${t.time ? t.time + ' ' : ''}${escapeHTML(t.title)}
              </div>`).join('')}
            ${dayTasks.length > 3 ? `<div class="cell-pill">+${dayTasks.length - 3}</div>` : ''}
          </div>
        `;
      }
      gridHtml += `</div>`;

      const selTasks = visibleTasks.filter(t => t.date === selectedDateStr);
      gridHtml += `
        <div class="day-block">
          <div class="day-header">
            <span class="day-name">Выбран день: ${selectedDateStr}</span>
            <button class="btn-mini" onclick="openDayTimeline('${selectedDateStr}')">Открыть по часам →</button>
          </div>
          <ul class="task-list">${selTasks.map(renderTaskItem).join('')}</ul>
          <input type="text" class="add-input" placeholder="+ Добавить на ${selectedDateStr}..." 
                 onkeydown="if(event.key==='Enter') addTask('${selectedDateStr}', null, this)">
        </div>
      `;
      main.innerHTML = gridHtml;

    } else if (currentView === 'day') {
      const dateStr = toISODate(anchorDate);
      const dayTasks = visibleTasks.filter(t => t.date === dateStr);
      const untimed = dayTasks.filter(t => !t.time);

      let html = `
        <div class="day-block">
          <div class="day-header">
            <span class="day-name">${DAYS_RU[anchorDate.getDay()]}, ${dateStr}</span>
            <span class="day-date">Весь день</span>
          </div>
          <ul class="task-list">${untimed.map(renderTaskItem).join('')}</ul>
          <input type="text" class="add-input" placeholder="+ Задача без точного часа..." 
                 onkeydown="if(event.key==='Enter') addTask('${dateStr}', null, this)">
        </div>
      `;

      for (let h = 7; h <= 22; h++) {
        const prefix = ('0' + h).slice(-2);
        const slotTasks = dayTasks.filter(t => (t.time || '').startsWith(prefix + ':'));
        html += `
          <div class="timeline-row">
            <div class="timeline-hour">${prefix}:00</div>
            <div class="timeline-slot">
              <ul class="task-list">${slotTasks.map(renderTaskItem).join('')}</ul>
              <input type="text" class="add-input" placeholder="+" style="padding:2px 0; font-size:13px;"
                     onkeydown="if(event.key==='Enter') addTask('${dateStr}', '${prefix}:00', this)">
            </div>
          </div>
        `;
      }
      main.innerHTML = html;
    }

    // Someday
    const somedayTasks = visibleTasks.filter(t => !t.date);
    document.getElementById('somedayList').innerHTML = somedayTasks.map(renderTaskItem).join('');
    updateSyncIndicator();
  }

  function selectMonthDay(dateStr) {
    selectedDateStr = dateStr;
    const [y, m, d] = dateStr.split('-').map(Number);
    anchorDate = new Date(y, m - 1, d);
    render();
  }

  function openDayTimeline(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    anchorDate = new Date(y, m - 1, d);
    selectedDateStr = dateStr;
    setView('day');
  }

  // --- СИНХРОНИЗАЦИЯ (SUPABASE REST) И БЭКАП ---
  function updateSyncIndicator(state) {
    const dot = document.getElementById('syncDot');
    const hasPending = tasks.some(t => t.syncStatus === 'pending');
    dot.className = 'sync-dot ' + (state === 'error' ? 'error' : (hasPending ? 'pending' : 'synced'));
  }

  function openSyncModal() {
    document.getElementById('sbUrl').value = config.sbUrl || '';
    document.getElementById('sbKey').value = config.sbKey || '';
    document.getElementById('syncModal').classList.add('open');
  }

  function closeSyncModal() {
    document.getElementById('syncModal').classList.remove('open');
  }

  function saveSyncConfig() {
    config.sbUrl = document.getElementById('sbUrl').value.trim().replace(/\/$/, '');
    config.sbKey = document.getElementById('sbKey').value.trim();
    saveConfig();
    syncNow();
    closeSyncModal();
  }

async function syncNow() {
    const dot = document.getElementById('syncDot');
    if (!config.sbUrl || !config.sbKey) {
      updateSyncIndicator();
      return;
    }
    if (!navigator.onLine) {
      updateSyncIndicator('pending');
      return;
    }

    const headers = {
      'apikey': config.sbKey,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    };
    // Если используется классический JWT-ключ (начинается с eyJ), добавляем Authorization
    if (config.sbKey.startsWith('eyJ')) {
      headers['Authorization'] = 'Bearer ' + config.sbKey;
    }

    try {
      // 1. Отправляем локальные изменения (Push)
      const pending = tasks.filter(t => t.syncStatus === 'pending');
      if (pending.length > 0) {
        const payload = pending.map(t => ({
          id: String(t.id),
          updated_at: Number(t.updatedAt || Date.now()),
          payload: t
        }));

        const resPush = await fetch(`${config.sbUrl}/rest/v1/tasks?on_conflict=id`, {
          method: 'POST',
          headers,
          body: JSON.stringify(payload)
        });

        if (!resPush.ok) {
          const errText = await resPush.text();
          throw new Error(`Ошибка отправки (${resPush.status}): ${errText}`);
        }

        // Сразу помечаем задачи как синхронизированные и сохраняем локально
        pending.forEach(t => t.syncStatus = 'synced');
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      // 2. Забираем свежие данные из облака (Pull)
      const resPull = await fetch(`${config.sbUrl}/rest/v1/tasks?select=*`, { headers });
      if (!resPull.ok) {
        const errText = await resPull.text();
        throw new Error(`Ошибка чтения (${resPull.status}): ${errText}`);
      }

      const remoteRows = await resPull.json();
      remoteRows.forEach(row => {
        const remoteTask = row.payload;
        if (!remoteTask || !remoteTask.id) return;
        remoteTask.syncStatus = 'synced';
        const localIdx = tasks.findIndex(x => x.id === remoteTask.id);
        if (localIdx === -1) {
          tasks.push(remoteTask);
        } else if (Number(row.updated_at) > Number(tasks[localIdx].updatedAt || 0)) {
          tasks[localIdx] = remoteTask;
        }
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      render();
      dot.className = 'sync-dot synced';
    } catch (e) {
      console.error('Sync error:', e);
      dot.className = 'sync-dot error';
      alert('Синхронизация не прошла:\n' + e.message);
    }
  }
  window.addEventListener('online', syncNow);

  function exportJSON() {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tweekcal-backup-${toISODate(new Date())}.json`;
    a.click();
  }

  function importJSON(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (Array.isArray(imported)) {
          tasks = imported;
          saveTasks();
          closeSyncModal();
        }
      } catch (err) { alert('Ошибка чтения JSON файла'); }
    };
    reader.readAsText(file);
  }

  function escapeHTML(str) {
    return String(str || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  autoRolloverPastTasks();
  render();
  syncNow();
</script>
</body>
</html>
