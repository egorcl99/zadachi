<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TweekCal">
  <title>TweekCal Pro</title>

  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%231c1c1e'/><rect x='28' y='36' width='124' height='22' rx='6' fill='%23ff3b30'/><circle cx='46' cy='88' r='8' fill='%2334c759'/><rect x='66' y='82' width='80' height='12' rx='6' fill='%23ffffff'/><circle cx='46' cy='126' r='8' fill='%23007aff'/><rect x='66' y='120' width='56' height='12' rx='6' fill='%238e8e93'/></svg>">
  <link rel="manifest" href='data:application/manifest+json,{"name":"TweekCal Pro","short_name":"TweekCal","start_url":".","display":"standalone","background_color":"#fdfdfd","theme_color":"#1c1c1e"}'>

  <style>
    :root {
      --bg: #fdfdfd;
      --surface: #ffffff;
      --surface-2: #f2f2f7;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #e5e5ea;
      --line: #1c1c1e;
      --accent: #1c1c1e;
      --accent-text: #ffffff;
      --today: #ff3b30;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --border: #38383a;
      --line: #f2f2f7;
      --accent: #ffffff;
      --accent-text: #000000;
      --today: #ff453a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      user-select: none;
      overscroll-behavior-y: none;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      z-index: 50;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .nav-group { display: flex; align-items: center; gap: 6px; }

    .title-month {
      font-size: 17px;
      font-weight: 700;
      min-width: 120px;
      text-align: center;
    }

    button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    button.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .search-bar {
      width: 100%;
      background: var(--surface-2);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      margin-top: 6px;
      display: none;
    }
    .search-bar.open { display: block; }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 10px 16px 100px 16px;
    }

    .day-block {
      padding: 14px 4px 8px 4px;
      border-bottom: 2px solid var(--line);
      border-radius: 8px;
      transition: background-color 0.15s, outline 0.15s;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .day-name { font-size: 16px; font-weight: 700; }
    .day-name.is-today { color: var(--today); }
    .day-date { font-size: 13px; color: var(--muted); }

    .task-list { list-style: none; padding: 0; margin: 0; min-height: 4px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      border-radius: 6px;
      background: var(--bg);
      transition: opacity 0.15s;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-item.dragging-source {
      opacity: 0.25;
      background: var(--surface-2);
    }

    .checkbox {
      width: 21px;
      height: 21px;
      border: 1.8px solid var(--muted);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      cursor: pointer;
    }

    .task-item.done .checkbox {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .color-pill-indicator {
      width: 4px;
      height: 18px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .task-body { flex-grow: 1; overflow: hidden; cursor: pointer; }
    .task-text { display: block; word-break: break-word; }

    .task-meta {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-mini {
      padding: 4px 7px;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface-2);
      border: none;
    }

    /* Ручка для перетаскивания пальцем */
    .drag-handle {
      padding: 6px 8px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: grab;
      touch-action: none;
      user-select: none;
      opacity: 0.65;
    }

    /* Призрак перетаскиваемой карточки */
    .drag-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--today);
      box-shadow: 0 12px 28px rgba(0,0,0,0.22);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 85vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: scale(1.03);
    }

    /* Подсветка зоны, куда упадет задача */
    .drop-zone-active {
      outline: 2px dashed var(--today) !important;
      background-color: rgba(255, 59, 48, 0.06) !important;
    }

    .add-input {
      width: 100%;
      border: none;
      padding: 9px 0 4px 0;
      font-size: 15px;
      background: transparent;
      outline: none;
      color: var(--text);
    }
    .add-input::placeholder { color: var(--muted); opacity: 0.6; }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .weekday-label {
      background: var(--surface-2);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 0;
      color: var(--muted);
    }

    .month-cell {
      background: var(--surface);
      min-height: 74px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
    }
    .month-cell.other-month { opacity: 0.35; }
    .month-cell.selected { outline: 2px solid var(--today); z-index: 2; }

    .cell-number {
      font-size: 12px;
      font-weight: 600;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .cell-number.is-today { background: var(--today); color: #fff; }

    .cell-pill {
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--surface-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 3px solid transparent;
    }
    .cell-pill.done { opacity: 0.4; text-decoration: line-through; }

    .timeline-row { display: flex; border-bottom: 1px solid var(--border); min-height: 48px; border-radius: 6px; }
    .timeline-hour { width: 52px; font-size: 12px; color: var(--muted); padding-top: 6px; flex-shrink: 0; }
    .timeline-slot { flex-grow: 1; padding: 4px 0; }

    .someday-box {
      margin-top: 24px;
      background: var(--surface-2);
      padding: 14px;
      border-radius: 12px;
      transition: outline 0.15s, background-color 0.15s;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }
    .modal-backdrop.open { display: flex; }

    .sheet {
      background: var(--surface);
      width: 100%;
      max-width: 600px;
      border-radius: 18px 18px 0 0;
      padding: 18px 16px calc(20px + env(safe-area-inset-bottom)) 16px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .form-row { margin-bottom: 12px; }
    .form-label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .form-input, .form-textarea {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }
    .form-row-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .color-picker { display: flex; gap: 10px; margin-top: 4px; }
    .color-Swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    }
    .color-Swatch.selected { border-color: var(--text); transform: scale(1.12); }

    .subtask-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="nav-group">
      <button onclick="shiftPeriod(-1)">←</button>
      <div class="title-month" id="headerTitle">Октябрь</div>
      <button onclick="shiftPeriod(1)">→</button>
      <button onclick="goToday()" style="font-size:12px">Сегодня</button>
    </div>
    <div class="nav-group">
      <button onclick="toggleSearch()" title="Поиск">🔍</button>
      <button onclick="toggleTheme()" title="Тема">◐</button>
      <button onclick="openBackupModal()" title="Резервная копия">💾</button>
    </div>
  </div>
  <div class="nav-group" style="width:100%">
    <button id="btnWeek" class="active" style="flex:1" onclick="setView('week')">Неделя</button>
    <button id="btnMonth" style="flex:1" onclick="setView('month')">Месяц</button>
    <button id="btnDay" style="flex:1" onclick="setView('day')">День (Часы)</button>
  </div>
  <input type="text" id="searchInput" class="search-bar" placeholder="Поиск по задачам и заметкам..." oninput="render()">
</header>

<div class="container">
  <div id="mainView"></div>

  <div class="someday-box" id="somedayContainer" data-drop-date="__SOMEDAY__">
    <div class="day-header">
      <span class="day-name">Когда-нибудь (Someday)</span>
      <span class="day-date">Без даты</span>
    </div>
    <ul class="task-list" id="somedayList"></ul>
    <input type="text" class="add-input" placeholder="+ Добавить задачу без даты..." 
           onkeydown="if(event.key==='Enter'){addTask(null, null, this); this.blur();}"
           onblur="addTask(null, null, this)">
  </div>
</div>

<!-- ШТОРКА ДЕТАЛЕЙ ЗАДАЧИ -->
<div class="modal-backdrop" id="taskModal" onclick="if(event.target===this) closeTaskModal()">
  <div class="sheet">
    <div class="sheet-header">
      <strong>Детали задачи</strong>
      <button onclick="closeTaskModal()">Готово</button>
    </div>
    <div class="form-row">
      <input type="text" id="editTitle" class="form-input" placeholder="Название задачи" style="font-weight:600">
    </div>
    <div class="form-row form-row-inline">
      <div>
        <label class="form-label">Дата (пусто = Someday)</label>
        <input type="date" id="editDate" class="form-input">
      </div>
      <div>
        <label class="form-label">Время (опционально)</label>
        <input type="time" id="editTime" class="form-input">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">Цвет маркера</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="form-row">
      <label class="form-label">Подзадачи (чеклист)</label>
      <div id="subtasksList"></div>
      <input type="text" id="newSubtaskInput" class="add-input" placeholder="+ Добавить подзадачу..."
             onkeydown="if(event.key==='Enter'){addSubtaskFromInput(); this.blur();}"
             onblur="addSubtaskFromInput()">
    </div>
    <div class="form-row">
      <label class="form-label">Заметка</label>
      <textarea id="editNotes" class="form-textarea" rows="3" placeholder="Ссылки, детали, мысли..."></textarea>
    </div>
    <div class="form-row">
      <label style="font-size:14px">
        <input type="checkbox" id="editRollover"> Автоперенос на сегодня, если просрочено
      </label>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:16px;">
      <button onclick="setEditDateToSomeday()">Убрать в Someday</button>
      <button onclick="deleteActiveTask()" style="color:#ff3b30; border-color:#ff3b30">Удалить задачу</button>
    </div>
  </div>
</div>

<!-- ШТОРКА РЕЗЕРВНОЙ КОПИИ -->
<div class="modal-backdrop" id="backupModal" onclick="if(event.target===this) closeBackupModal()">
  <div class="sheet">
    <div class="sheet-header">
      <strong>Резервная копия данных</strong>
      <button onclick="closeBackupModal()">Закрыть</button>
    </div>
    <p style="font-size:13px; color:var(--muted); margin-top:0;">
      Все задачи хранятся локально в памяти вашего iPhone. Вы можете скачать резервную копию в файл или восстановить данные из файла.
    </p>
    <div class="form-row" style="display:flex; gap:8px; margin-top:12px;">
      <button onclick="exportJSON()" style="flex:1">Скачать бэкап (.json)</button>
      <button onclick="document.getElementById('importFile').click()" style="flex:1">Загрузить из файла</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }

  const STORAGE_KEY = 'tweek_cal_tasks_v1';
  const CONFIG_KEY = 'tweek_cal_config_v1';
  const COLORS = ['transparent', '#ff3b30', '#ff9500', '#34c759', '#007aff', '#af52de'];

  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let config = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{"theme":"light"}');
  let currentView = 'week';
  let anchorDate = new Date();
  let selectedDateStr = toISODate(new Date());
  let editingTaskId = null;
  let editingColor = 'transparent';

  // Инициализация порядка сортировки для существующих задач
  tasks.forEach((t, idx) => {
    if (typeof t.order !== 'number') t.order = (idx + 1) * 1000;
  });

  const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const DAYS_RU = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const SHORT_DAYS_RU = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

  document.documentElement.setAttribute('data-theme', config.theme || 'light');

  function toISODate(d) {
    const z = n => ('0' + n).slice(-2);
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  }

  function saveConfig() { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }
  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    render();
  }

  function getNextOrderForDate(dateStr) {
    const sameDay = tasks.filter(t => !t.deleted && (t.date || null) === (dateStr || null));
    if (!sameDay.length) return 1000;
    return Math.max(...sameDay.map(t => t.order || 0)) + 1000;
  }

  function autoRolloverPastTasks() {
    const todayStr = toISODate(new Date());
    let changed = false;
    tasks.forEach(t => {
      if (!t.deleted && t.date && t.date < todayStr && !t.completed && t.rollover !== false) {
        t.date = todayStr;
        t.updatedAt = Date.now();
        changed = true;
      }
    });
    if (changed) saveTasks();
  }

  function addTask(dateStr, timeStr, inputEl) {
    if (!inputEl) return;
    const title = inputEl.value.trim();
    if (!title) {
      inputEl.value = '';
      return;
    }
    inputEl.value = '';
    tasks.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
      title,
      date: dateStr,
      time: timeStr || '',
      notes: '',
      color: 'transparent',
      subtasks: [],
      completed: false,
      rollover: true,
      deleted: false,
      order: getNextOrderForDate(dateStr),
      updatedAt: Date.now()
    });
    saveTasks();
  }

  function toggleTask(id) {
    const t = tasks.find(x => x.id === id);
    if (t) {
      t.completed = !t.completed;
      t.updatedAt = Date.now();
      saveTasks();
    }
  }

  function moveTaskTomorrow(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (!t.date) {
      t.date = toISODate(new Date());
    } else {
      const [y, m, d] = t.date.split('-').map(Number);
      t.date = toISODate(new Date(y, m - 1, d + 1));
    }
    t.order = getNextOrderForDate(t.date);
    t.updatedAt = Date.now();
    saveTasks();
  }

  function openTaskModal(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    editingTaskId = id;
    editingColor = t.color || 'transparent';
    document.getElementById('editTitle').value = t.title;
    document.getElementById('editDate').value = t.date || '';
    document.getElementById('editTime').value = t.time || '';
    document.getElementById('editNotes').value = t.notes || '';
    document.getElementById('editRollover').checked = t.rollover !== false;
    renderColorPicker();
    renderSubtasks(t);
    document.getElementById('taskModal').classList.add('open');
  }

  function renderColorPicker() {
    const box = document.getElementById('colorPicker');
    box.innerHTML = COLORS.map(c => `
      <div class="color-Swatch ${editingColor === c ? 'selected' : ''}" 
           style="background:${c === 'transparent' ? 'var(--surface-2)' : c}"
           onclick="selectEditColor('${c}')"></div>
    `).join('');
  }

  function selectEditColor(c) {
    editingColor = c;
    renderColorPicker();
  }

  function renderSubtasks(t) {
    const list = t.subtasks || [];
    document.getElementById('subtasksList').innerHTML = list.map((s, idx) => `
      <div class="subtask-row">
        <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask(${idx})">
        <span style="flex:1; font-size:14px; ${s.done ? 'text-decoration:line-through;color:var(--muted)' : ''}">${escapeHTML(s.text)}</span>
        <button class="btn-mini" onclick="removeSubtask(${idx})">✕</button>
      </div>
    `).join('');
  }

  function addSubtaskFromInput() {
    const input = document.getElementById('newSubtaskInput');
    if (!input) return;
    const text = input.value.trim();
    if (!text || !editingTaskId) {
      input.value = '';
      return;
    }
    input.value = '';
    const t = tasks.find(x => x.id === editingTaskId);
    if (!t.subtasks) t.subtasks = [];
    t.subtasks.push({ text, done: false });
    renderSubtasks(t);
  }

  function toggleSubtask(idx) {
    const t = tasks.find(x => x.id === editingTaskId);
    if (t && t.subtasks && t.subtasks[idx]) {
      t.subtasks[idx].done = !t.subtasks[idx].done;
      renderSubtasks(t);
    }
  }

  function removeSubtask(idx) {
    const t = tasks.find(x => x.id === editingTaskId);
    if (t && t.subtasks) { t.subtasks.splice(idx, 1); renderSubtasks(t); }
  }

  function setEditDateToSomeday() {
    document.getElementById('editDate').value = '';
    document.getElementById('editTime').value = '';
  }

  function closeTaskModal() {
    addSubtaskFromInput();
    if (editingTaskId) {
      const t = tasks.find(x => x.id === editingTaskId);
      if (t) {
        const newTitle = document.getElementById('editTitle').value.trim();
        if (newTitle) t.title = newTitle;
        t.date = document.getElementById('editDate').value || null;
        t.time = document.getElementById('editTime').value || '';
        t.notes = document.getElementById('editNotes').value;
        t.color = editingColor;
        t.rollover = document.getElementById('editRollover').checked;
        t.updatedAt = Date.now();
        saveTasks();
      }
    }
    editingTaskId = null;
    document.getElementById('taskModal').classList.remove('open');
  }

  function deleteActiveTask() {
    if (!editingTaskId) return;
    const t = tasks.find(x => x.id === editingTaskId);
    if (t) { t.deleted = true; t.updatedAt = Date.now(); saveTasks(); }
    editingTaskId = null;
    document.getElementById('taskModal').classList.remove('open');
  }

  function setView(v) {
    currentView = v;
    document.getElementById('btnWeek').classList.toggle('active', v === 'week');
    document.getElementById('btnMonth').classList.toggle('active', v === 'month');
    document.getElementById('btnDay').classList.toggle('active', v === 'day');
    render();
  }

  function shiftPeriod(dir) {
    if (currentView === 'week') anchorDate.setDate(anchorDate.getDate() + dir * 7);
    else if (currentView === 'month') anchorDate.setMonth(anchorDate.getMonth() + dir);
    else {
      anchorDate.setDate(anchorDate.getDate() + dir);
      selectedDateStr = toISODate(anchorDate);
    }
    render();
  }

  function goToday() {
    anchorDate = new Date();
    selectedDateStr = toISODate(anchorDate);
    render();
  }

  function toggleTheme() {
    config.theme = config.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', config.theme);
    saveConfig();
  }

  function toggleSearch() {
    const sb = document.getElementById('searchInput');
    sb.classList.toggle('open');
    if (sb.classList.contains('open')) sb.focus();
    else { sb.value = ''; render(); }
  }

  function openBackupModal() { document.getElementById('backupModal').classList.add('open'); }
  function closeBackupModal() { document.getElementById('backupModal').classList.remove('open'); }

  function exportJSON() {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `tweekcal-backup-${toISODate(new Date())}.json`;
    a.click();
  }

  function importJSON(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (Array.isArray(imported)) { tasks = imported; saveTasks(); closeBackupModal(); }
      } catch (err) { alert('Ошибка чтения файла бэкапа'); }
    };
    reader.readAsText(file);
  }

  function getActiveTasks() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    return tasks.filter(t => {
      if (t.deleted) return false;
      if (!q) return true;
      return t.title.toLowerCase().includes(q) || (t.notes || '').toLowerCase().includes(q);
    }).sort((a, b) => {
      const ta = a.time || '';
      const tb = b.time || '';
      if (ta !== tb) {
        if (!ta) return 1;
        if (!tb) return -1;
        return ta.localeCompare(tb);
      }
      return (a.order || 0) - (b.order || 0);
    });
  }

  function renderTaskItem(t) {
    const subCount = (t.subtasks || []).length;
    const subDone = (t.subtasks || []).filter(s => s.done).length;
    return `
      <li class="task-item ${t.completed ? 'done' : ''}" data-task-id="${t.id}">
        <div class="checkbox" onclick="toggleTask('${t.id}')">${t.completed ? '✓' : ''}</div>
        ${t.color && t.color !== 'transparent' ? `<div class="color-pill-indicator" style="background:${t.color}"></div>` : ''}
        <div class="task-body" onclick="openTaskModal('${t.id}')">
          <span class="task-text">${escapeHTML(t.title)}</span>
          <div class="task-meta">
            ${t.time ? `<span>⏰ ${t.time}</span>` : ''}
            ${subCount ? `<span>☑ ${subDone}/${subCount}</span>` : ''}
            ${t.notes ? `<span>📝</span>` : ''}
          </div>
        </div>
        <button class="btn-mini" title="На +1 день" onclick="moveTaskTomorrow('${t.id}')">→</button>
        <div class="drag-handle" data-drag-id="${t.id}" title="Зажмите и перетащите">⋮⋮</div>
      </li>
    `;
  }

  function render() {
    const todayStr = toISODate(new Date());
    const visibleTasks = getActiveTasks();
    document.getElementById('headerTitle').textContent = 
      `${MONTHS_RU[anchorDate.getMonth()]} ${anchorDate.getFullYear()}`;

    const main = document.getElementById('mainView');

    if (currentView === 'week') {
      const d = new Date(anchorDate);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));

      let html = '';
      for (let i = 0; i < 7; i++) {
        const cur = new Date(monday);
        cur.setDate(monday.getDate() + i);
        const dateStr = toISODate(cur);
        const dayTasks = visibleTasks.filter(t => t.date === dateStr);
        const isToday = dateStr === todayStr;

        html += `
          <div class="day-block" data-drop-date="${dateStr}">
            <div class="day-header">
              <span class="day-name ${isToday ? 'is-today' : ''}" onclick="openDayTimeline('${dateStr}')" style="cursor:pointer">
                ${DAYS_RU[cur.getDay()]}
              </span>
              <span class="day-date">${cur.getDate()}.${('0'+(cur.getMonth()+1)).slice(-2)}</span>
            </div>
            <ul class="task-list">${dayTasks.map(renderTaskItem).join('')}</ul>
            <input type="text" class="add-input" placeholder="+ Добавить задачу..." 
                   onkeydown="if(event.key==='Enter'){addTask('${dateStr}', null, this); this.blur();}"
                   onblur="addTask('${dateStr}', null, this)">
          </div>
        `;
      }
      main.innerHTML = html;

    } else if (currentView === 'month') {
      const year = anchorDate.getFullYear();
      const month = anchorDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const startOffset = (firstDay.getDay() + 6) % 7;
      const startDate = new Date(year, month, 1 - startOffset);

      let gridHtml = `<div class="month-grid">`;
      SHORT_DAYS_RU.forEach(label => gridHtml += `<div class="weekday-label">${label}</div>`);

      for (let i = 0; i < 42; i++) {
        const cur = new Date(startDate);
        cur.setDate(startDate.getDate() + i);
        const dateStr = toISODate(cur);
        const inMonth = cur.getMonth() === month;
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDateStr;
        const dayTasks = visibleTasks.filter(t => t.date === dateStr);

        gridHtml += `
          <div class="month-cell ${inMonth ? '' : 'other-month'} ${isSelected ? 'selected' : ''}" 
               data-drop-date="${dateStr}"
               onclick="selectMonthDay('${dateStr}')">
            <div class="cell-number ${isToday ? 'is-today' : ''}">${cur.getDate()}</div>
            ${dayTasks.slice(0, 3).map(t => `
              <div class="cell-pill ${t.completed ? 'done' : ''}" style="border-left-color:${t.color || 'transparent'}">
                ${t.time ? t.time + ' ' : ''}${escapeHTML(t.title)}
              </div>`).join('')}
            ${dayTasks.length > 3 ? `<div class="cell-pill">+${dayTasks.length - 3}</div>` : ''}
          </div>
        `;
      }
      gridHtml += `</div>`;

      const selTasks = visibleTasks.filter(t => t.date === selectedDateStr);
      gridHtml += `
        <div class="day-block" data-drop-date="${selectedDateStr}">
          <div class="day-header">
            <span class="day-name">Выбран день: ${selectedDateStr}</span>
            <button class="btn-mini" onclick="openDayTimeline('${selectedDateStr}')">По часам →</button>
          </div>
          <ul class="task-list">${selTasks.map(renderTaskItem).join('')}</ul>
          <input type="text" class="add-input" placeholder="+ Добавить на ${selectedDateStr}..." 
                 onkeydown="if(event.key==='Enter'){addTask('${selectedDateStr}', null, this); this.blur();}"
                 onblur="addTask('${selectedDateStr}', null, this)">
        </div>
      `;
      main.innerHTML = gridHtml;

    } else if (currentView === 'day') {
      const dateStr = toISODate(anchorDate);
      const dayTasks = visibleTasks.filter(t => t.date === dateStr);
      const untimed = dayTasks.filter(t => !t.time);

      let html = `
        <div class="day-block" data-drop-date="${dateStr}" data-drop-time="__CLEAR__">
          <div class="day-header">
            <span class="day-name">${DAYS_RU[anchorDate.getDay()]}, ${dateStr}</span>
            <span class="day-date">Весь день</span>
          </div>
          <ul class="task-list">${untimed.map(renderTaskItem).join('')}</ul>
          <input type="text" class="add-input" placeholder="+ Задача без точного часа..." 
                 onkeydown="if(event.key==='Enter'){addTask('${dateStr}', null, this); this.blur();}"
                 onblur="addTask('${dateStr}', null, this)">
        </div>
      `;

      for (let h = 7; h <= 22; h++) {
        const prefix = ('0' + h).slice(-2);
        const slotTasks = dayTasks.filter(t => (t.time || '').startsWith(prefix + ':'));
        html += `
          <div class="timeline-row" data-drop-date="${dateStr}" data-drop-time="${prefix}:00">
            <div class="timeline-hour">${prefix}:00</div>
            <div class="timeline-slot">
              <ul class="task-list">${slotTasks.map(renderTaskItem).join('')}</ul>
              <input type="text" class="add-input" placeholder="+" style="padding:2px 0; font-size:13px;"
                     onkeydown="if(event.key==='Enter'){addTask('${dateStr}', '${prefix}:00', this); this.blur();}"
                     onblur="addTask('${dateStr}', '${prefix}:00', this)">
            </div>
          </div>
        `;
      }
      main.innerHTML = html;
    }

    const somedayTasks = visibleTasks.filter(t => !t.date);
    document.getElementById('somedayList').innerHTML = somedayTasks.map(renderTaskItem).join('');
  }

  function selectMonthDay(dateStr) {
    selectedDateStr = dateStr;
    const [y, m, d] = dateStr.split('-').map(Number);
    anchorDate = new Date(y, m - 1, d);
    render();
  }

  function openDayTimeline(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    anchorDate = new Date(y, m - 1, d);
    selectedDateStr = dateStr;
    setView('day');
  }

  function escapeHTML(str) {
    return String(str || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  // --- СЕНСОРНЫЙ ДВИЖОК ПЕРЕТАСКИВАНИЯ (DRAG AND DROP) ---
  let dragState = null;

  function initDragStart(taskId, clientX, clientY, sourceRow) {
    const task = tasks.find(x => x.id === taskId);
    if (!task) return;

    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.textContent = task.title;
    document.body.appendChild(ghost);

    if (sourceRow) sourceRow.classList.add('dragging-source');

    dragState = {
      taskId,
      ghost,
      sourceRow,
      activeZone: null,
      clientX,
      clientY,
      scrollTimer: setInterval(handleDragAutoScroll, 25)
    };
    updateGhostPos(clientX, clientY);
  }

  function updateGhostPos(x, y) {
    if (!dragState) return;
    dragState.clientX = x;
    dragState.clientY = y;
    dragState.ghost.style.left = Math.max(12, Math.min(window.innerWidth - 220, x - 110)) + 'px';
    dragState.ghost.style.top = (y - 34) + 'px';

    const elUnder = document.elementFromPoint(x, y);
    const zone = elUnder ? elUnder.closest('[data-drop-date]') : null;

    if (dragState.activeZone && dragState.activeZone !== zone) {
      dragState.activeZone.classList.remove('drop-zone-active');
    }
    if (zone) {
      zone.classList.add('drop-zone-active');
    }
    dragState.activeZone = zone;
  }

  function handleDragAutoScroll() {
    if (!dragState) return;
    const y = dragState.clientY;
    const edge = 75;
    if (y < edge) window.scrollBy(0, -10);
    else if (y > window.innerHeight - edge) window.scrollBy(0, 10);
  }

  function finishDrag(x, y) {
    if (!dragState) return;
    clearInterval(dragState.scrollTimer);

    const elUnder = document.elementFromPoint(x, y);
    const zone = elUnder ? elUnder.closest('[data-drop-date]') : dragState.activeZone;
    const overTaskRow = elUnder ? elUnder.closest('.task-item[data-task-id]') : null;

    if (dragState.activeZone) dragState.activeZone.classList.remove('drop-zone-active');
    if (dragState.sourceRow) dragState.sourceRow.classList.remove('dragging-source');
    dragState.ghost.remove();

    const task = tasks.find(t => t.id === dragState.taskId);
    if (task && zone) {
      const rawDate = zone.getAttribute('data-drop-date');
      const rawTime = zone.getAttribute('data-drop-time');
      const targetDate = rawDate === '__SOMEDAY__' ? null : rawDate;

      task.date = targetDate;
      if (rawTime === '__CLEAR__') task.time = '';
      else if (rawTime) task.time = rawTime;

      // Сортировка внутри целевого дня при наведении на конкретную задачу
      const overId = overTaskRow ? overTaskRow.getAttribute('data-task-id') : null;
      if (overId && overId !== task.id) {
        const siblings = getActiveTasks().filter(t => t.id !== task.id && (t.date || null) === targetDate);
        const targetIdx = siblings.findIndex(t => t.id === overId);
        const rect = overTaskRow.getBoundingClientRect();
        const insertAfter = y > (rect.top + rect.height / 2);

        if (targetIdx !== -1) {
          const insertPos = insertAfter ? targetIdx + 1 : targetIdx;
          siblings.splice(insertPos, 0, task);
          siblings.forEach((item, i) => { item.order = (i + 1) * 1000; });
        } else {
          task.order = getNextOrderForDate(targetDate);
        }
      } else {
        task.order = getNextOrderForDate(targetDate);
      }

      task.updatedAt = Date.now();
      saveTasks();
    }

    dragState = null;
  }

  // События Touch (iPhone / iPad)
  document.addEventListener('touchstart', e => {
    const handle = e.target.closest('.drag-handle');
    if (handle) {
      e.preventDefault();
      const t = e.touches[0];
      initDragStart(handle.getAttribute('data-drag-id'), t.clientX, t.clientY, handle.closest('.task-item'));
      return;
    }

    // Скрытие клавиатуры и автосохранение при касании вне поля ввода
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
      if (!e.target.closest('input, textarea, button')) {
        active.blur();
      }
    }
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    if (!dragState) return;
    e.preventDefault();
    const t = e.touches[0];
    updateGhostPos(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (!dragState) return;
    const t = e.changedTouches[0];
    finishDrag(t.clientX, t.clientY);
  });

  // События мыши (для удобства проверки на ПК)
  document.addEventListener('mousedown', e => {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    e.preventDefault();
    initDragStart(handle.getAttribute('data-drag-id'), e.clientX, e.clientY, handle.closest('.task-item'));
  });

  document.addEventListener('mousemove', e => {
    if (!dragState) return;
    updateGhostPos(e.clientX, e.clientY);
  });

  document.addEventListener('mouseup', e => {
    if (!dragState) return;
    finishDrag(e.clientX, e.clientY);
  });

  autoRolloverPastTasks();
  render();
</script>
</body>
</html>
